[package]
name = "vsm-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
vsm = { path = "../../crates/vsm" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
